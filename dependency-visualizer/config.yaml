# Конфигурация визуализатора графа зависимостей npm-пакетов

# Имя анализируемого пакета
package: express

# URL-адрес репозитория (режим off) или путь к файлу тестового репозитория (режим file)
repository: https://registry.npmjs.org

# Режим работы с тестовым репозиторием: off — реальный репозиторий, file — файл описания графа
test_repo_mode: off

# Версия пакета (вида 1.2.3) или latest
version: "4.21.2"

# Подстрока для фильтрации пакетов (пакеты, содержащие её в имени, исключаются)
filter: debug
